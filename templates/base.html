{% load static tailwind_tags %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Marco Richetta{% endblock %}</title>
    {% tailwind_css %}
</head>

<body class="min-h-screen bg-stone-50 text-stone-800">
    <header class="py-6 border-b border-stone-200">
        <nav class="max-w-4xl mx-auto px-6 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-stone-900 tracking-tight">MRC</a>
            <div class="flex items-center gap-6">
                <a href="/" class="text-stone-600 hover:text-stone-900 transition-colors">Home</a>
                <a href="/about/" class="text-stone-600 hover:text-stone-900 transition-colors">About</a>
                <a href="https://blog.marcorichetta.dev" target="_blank" rel="noopener"
                    class="text-stone-600 hover:text-stone-900 transition-colors">Blog</a>
            </div>
        </nav>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-12">
        {% block content %}{% endblock %}
    </main>

    <footer class="py-8 border-t border-stone-200 mt-auto">
        <div class="max-w-4xl mx-auto px-6 text-center text-stone-500 text-sm">
            <p>&copy; {% now "Y" %} Marco Richetta</p>
            <p class="mt-1">
                <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="license"
                    class="hover:text-stone-700 transition-colors">CC BY 4.0</a>
            </p>
        </div>
    </footer>
</body>

</html>
