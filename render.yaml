databases:
    - name: personal_site_db
      plan: free
      databaseName: personal_site
      user: admin

services:
    - type: web
      plan: free
      name: personal_site
      runtime: python
      buildCommand: "./build.sh"
      startCommand: "python -m gunicorn personal_site.asgi:application -k uvicorn.workers.UvicornWorker"
      envVars:
          - key: DATABASE_URL
            fromDatabase:
                name: personal_site_db
                property: connectionString
          - key: SECRET_KEY
            generateValue: true
          - key: WEB_CONCURRENCY
            value: 4
